<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Landed</title>
<meta name="description" content="Page not found.">
<link rel="canonical" href="https://justlanded.app/404">
<link rel="icon" href="/favicon.png">
<meta name="theme-color" content="#070B16">
<style>
  :root { color-scheme: dark; --bg:#070B16; --card:#0C1426; --line:#1C2A45; --text:#EEF2FA; --muted:#A9B4C9; --dim:#6B778F; --accent:#5EB8FF; --green:#4ADE9C; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--muted); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  a { color:var(--accent); }
  header, main, footer { max-width:760px; margin:0 auto; padding:0 20px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:24px; padding-bottom:8px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; color:var(--text); font-weight:800; font-size:20px; text-decoration:none; }
  .brand img { width:28px; height:28px; }
  nav { display:flex; gap:18px; font-size:15px; }
  nav a { color:var(--muted); text-decoration:none; } nav a:hover, nav a[aria-current] { color:var(--text); }
  h1 { color:var(--text); font-size:34px; line-height:1.2; margin:40px 0 8px; }
  h2 { color:var(--text); font-size:19px; margin:32px 0 6px; }
  .updated { color:var(--dim); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin:20px 0; }
  .hero { text-align:center; padding:64px 0 24px; }
  .hero img { width:120px; height:auto; }
  .hero h1 { font-size:44px; margin-top:20px; }
  .lead { font-size:19px; color:var(--muted); max-width:560px; margin:0 auto; }
  .features { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin:36px 0; }
  .features .card { margin:0; } .features b { color:var(--text); display:block; margin-bottom:4px; }
  .pill { display:inline-block; margin-top:28px; padding:10px 18px; border-radius:999px; border:1px solid var(--line); color:var(--text); background:var(--card); }
  footer { color:var(--dim); font-size:14px; padding-top:40px; padding-bottom:40px; }
</style></head>
<body>
<header>
  <a class="brand" href="/"><img src="/logo.svg" alt="">Landed</a>
  <nav><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/support/">Support</a></nav>
</header>
<main>
<h1>Page not found</h1><p><a href="/">Go to the home page</a></p>
</main>
<footer>© 2026 Muochu Hu · <a href="mailto:support@justlanded.app">support@justlanded.app</a></footer>
</body></html>
